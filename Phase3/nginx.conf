
    #Define a custom log format that exposes the target container's destination IP
    log_format microservices_layout '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    'to: $upstream_addr status: $upstream_status';

    upstream auth_cluster {
        server auth-service:8080;
    }

    upstream order_cluster {
        server order-service:8080;
    }

    upstream inventory_cluster {
        server inventory-service:8080;
    }

    server {
        listen 8000; # The unified entryway for everything
        server_name localhost;

        #Force this server block to use new log layout
        access_log /var/log/nginx/access.log microservices_layout;

        # Directs any request starting with /auth/ to the auth_cluster
        location /auth/ {
            proxy_pass http://auth_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Directs any request starting with /orders/ to the order_cluster
        location /orders {
            proxy_pass http://order_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Directs any request starting with /inventory/ to the inventory_cluster
        location /inventory/ {
            proxy_pass http://inventory_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

